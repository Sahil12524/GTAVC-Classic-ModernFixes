[FixedTick]
; The game world (physics, AI, scripts) updates TickRate times per second, exactly
; like the original game running at that frame rate, while frames are drawn as fast
; as FPSLimit allows. 30 = the original game's own frame limiter. 0 = off.
Enabled=1
TickRate=30

[FrameLimiter]
; 0 = your display's refresh rate, -1 = unlimited, or a number of frames per second.
FPSLimit=0

[Display]
; Fullscreen refresh rate in Hz. 0 = the highest your display supports at the game's
; resolution (the game itself would use the driver default, usually 60 Hz).
RefreshRate=0

[Compatibility]
; Run the game on one CPU (0 = "CPU 0", 1 = "CPU 1" in Task Manager's affinity
; list), like setting affinity by hand. -1 = all cores (default).
CPUCore=-1
; Another d3d8.dll to pass graphics through to (d3d8to9, dgVoodoo...): rename it,
; e.g. to d3d8_next.dll, put it next to gta-vc.exe and set D3D8Chain=d3d8_next.dll.
; Empty = Windows' own d3d8.dll.
D3D8Chain=

[Streaming]
; Read audio\SFX.RAW and models\gta3.img once at startup, at low priority, so
; Windows keeps them in RAM and ped speech / model loading don't freeze the game
; for a moment on a hard disk. 1 = on, 0 = off.
PreloadFiles=1
; Memory in MB the game may keep loaded models and textures in (the game gives
; itself 45). More = buildings and cars loaded once stay loaded: less popping in,
; fewer low-detail stand-ins. 0 = the game's own.
MemoryMB=512
; Vehicle models kept loaded at once (game: 25, at most 50). More = more kinds of
; cars in traffic without loading. 0 = the game's own.
VehicleModels=50

[DrawDistance]
; Times the menu's Draw Distance: how far full-detail buildings, objects, peds and
; vehicles are drawn before the low-detail versions take over (the game also stops
; full detail at 300 m; that becomes 300 m times this). 1 = the game's own, up to 5.
Scale=3.0
; Times the weather's far clip: how far anything is seen before the fog. 1 = the
; game's own, up to 3.
FarClip=1.5

[Graphics]
; Anisotropic texture filtering: roads, walls and ground seen at an angle stay
; sharp instead of blurring. 2-16, 0 = the game's own.
Anisotropic=16

[Camera]
; Look around the vehicle you're in with the mouse. 1 = on, 0 = off.
FreeCam=1
; Mouse speed in percent of the on-foot camera's (which follows the game's own
; mouse sensitivity setting).
FreeCamSensitivity=100
; While driving, the camera goes back behind the vehicle after the mouse has been
; still this many milliseconds. -1 = never. Parked, it always stays where you put it.
FreeCamReturnDelay=1500
; 1 = moving the mouse forward lowers the camera instead of raising it.
FreeCamInvertY=0

[QuickSave]
; F5 saves the game as it is right now, F9 loads that save. Not while wanted, on a
; mission or on water. 1 = on, 0 = off.
Enabled=1
; The game save slot (1-8) the quick save goes into; it also shows in Load Game.
; The save is named "Quick Save". If the slot holds one of your own saves, it is
; first copied to GTAVCsf<slot> (before quick save).b in the same folder.
Slot=8
; Keys as Windows virtual-key codes: 116 = F5, 120 = F9.
SaveKey=116
LoadKey=120
; Also quick save by itself every this many minutes of play (paused menus don't
; count), into the same slot, so F9 loads it. Only when it is safe: no mission or
; job, not wanted, not on water, not on a phone call or in a cutscene, in control
; and not in the air. If it isn't safe it waits and saves once it is. Any save
; restarts the count. 0 = off.
AutoMinutes=5

[AutoSave]
; Saves the game a few seconds after you pass a mission or finish a job (taxi,
; vigilante, firefighter, paramedic, rampages...) with money earned, once you are
; not wanted, not on water and in control. Not after being wasted or busted.
; Like a safehouse save, loading it starts you at your nearest safehouse.
; 1 = on, 0 = off.
Enabled=1
; The game save slot (1-8). The save is named "Auto Save"; one of your own saves
; in that slot is first copied to GTAVCsf<slot> (before auto save).b.
Slot=7

[Vehicles]
; In the Rhino the turret, and in the fire truck the water cannon, aim where the
; camera looks: move the mouse to aim (FreeCam on). 1 = on, 0 = off.
MouseAim=1

[Fixes]
; "Martha's Mug Shot" swaps the Ocean Drive hotel for a stand-in model while you are
; on its roof. If the mission ends without swapping it back, the hotel stays without
; walls (and saves keep it that way). Off a mission, it is put back. 1 = on.
MissionLeftovers=1

[Weapons]
; Walk, run and sprint while firing any gun, each with its own animation (the fire
; animations no longer lock the legs). Sprint and jump with the rocket launcher and
; minigun. The M4, Ruger and M60 aim in third person instead of the first-person
; scope, so you can move while aiming. 1 = on.
RunAndGun=1
; Getting shot no longer stops your shooting (you still flinch). 1 = on.
KeepFiringWhenHit=1

[Population]
; How busy the streets are, 0.5 to 3 (0 = leave it to the game, which uses 0.6
; without a gta3.ini). Peds: up to 25 x PedDensity on the streets. Cars: up to
; 12 x CarDensity traffic cars.
PedDensity=2.5
CarDensity=1.5
; A ped you turn the camera away from is kept until it is this many metres away
; (25 to 50; the game removes it at 25, so peds vanish when you look around).
KeepOffscreen=50

[PhoneSkip]
; During a phone call you answered (Tab), Enter skips the rest of the call. 1 = on.
Enabled=1
; Key as a Windows virtual-key code: 13 = Enter.
Key=13

[Interiors]
; Teleporting out of a room shows the city again, and flying into a room (jetpack)
; shows that room, with the scene loaded around you. 1 = on, 0 = off.
AutoSwitch=1
; Inside an interior that is built into the city (Ocean View, the mall, Malibu...)
; the city around it is drawn too: open doors show the street, not black.
ShowOutside=1
; Walking through an interior's door doesn't fade the screen to black and back:
; the room (or the street) is there at once. Missions' and cutscenes' fades stay.
NoDoorFade=1
