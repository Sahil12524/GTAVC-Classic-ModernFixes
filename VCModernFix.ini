[FixedTick]
; The game world (physics, AI, scripts) updates TickRate times per second, exactly
; like the original game running at that frame rate, while frames are drawn as fast
; as FPSLimit allows. 30 = the original game's own frame limiter. 0 = off.
Enabled=1
TickRate=30

[FrameLimiter]
; 0 = your display's refresh rate (with vsync on, vsync alone paces the frames),
; -1 = unlimited (vsync off too, also through d3d8to9 / DXVK), or a number of
; frames per second.
FPSLimit=0

[Display]
; Fullscreen refresh rate in Hz. 0 = the highest your display supports at the game's
; resolution (the game itself would use the driver default, usually 60 Hz).
RefreshRate=0

[Compatibility]
; Run the game on one CPU (0 = "CPU 0", 1 = "CPU 1" in Task Manager's affinity
; list), like setting affinity by hand. -1 = all cores (default).
CPUCore=-1
; Another d3d8.dll to pass graphics through to (d3d8to9, dgVoodoo...): rename it,
; e.g. to d3d8_next.dll, put it next to gta-vc.exe and set D3D8Chain=d3d8_next.dll.
; Empty = Windows' own d3d8.dll.
D3D8Chain=

[Streaming]
; Read audio\SFX.RAW and models\gta3.img once at startup, at low priority, so
; Windows keeps them in RAM and ped speech / model loading don't freeze the game
; for a moment on a hard disk. 1 = on, 0 = off.
PreloadFiles=1
; Memory in MB the game may keep loaded models and textures in (the game gives
; itself 45). More = buildings and cars loaded once stay loaded: less popping in,
; fewer low-detail stand-ins. 0 = the game's own.
MemoryMB=512
; Vehicle models kept loaded at once (game: 25, at most 50). More = more kinds of
; cars in traffic without loading. 0 = the game's own.
VehicleModels=50
; Load models and textures faster: before each game update, up to this many
; milliseconds of extra loading while anything is waiting (the game loads one
; batch per update, so textures can show up late or blurry when you move fast).
; 0 = the game's own rate, up to 20.
FastLoadMs=4
; No "Greetings from Vice City" loading screen flashing up when you cross to the
; other island; the island still loads. 1 = on, 0 = the game's screen.
NoIslandScreen=1

[DrawDistance]
; Times the menu's Draw Distance: how far full-detail buildings, objects, peds and
; vehicles are drawn before the low-detail versions take over (the game also stops
; full detail at 300 m; that becomes 300 m times this). 1 = the game's own, up to 5.
Scale=3.0
; Times the weather's far clip: how far anything is seen before the fog. 1 = the
; game's own, up to 3.
FarClip=1.5
; 1 = high up (above 100 m: helicopters, planes) the view reaches further the
; higher you are, up to 4 km, and the fog moves out with it. 0 = the game's own.
HighView=1
; 1 = objects, roads and building walls at the edges of the screen don't vanish
; while a helicopter or plane banks or pitches (the game's world scan only covered
; part of a tilted view). 0 = the game's own.
FullViewScan=1

[Graphics]
; Anisotropic texture filtering: roads, walls and ground seen at an angle stay
; sharp instead of blurring. 2-16, 0 = the game's own.
Anisotropic=16
; Palm and tree leaves drawn in two passes: solid parts first, then the soft
; edges without hiding what is behind them (no leaves missing in boxes of sky).
; 1 = on, 0 = the game's own.
TwoPassAlpha=1
; Widescreen: the picture fits the screen's real shape (16:9, 21:9...) instead of
; stretching the game's 4:3 one: you see more to the sides, and the HUD, radar and
; kill frenzy text keep their 4:3 proportions. 1 = on, 0 = the game's own.
Widescreen=1
; Light coronas (street lamps, windows, neon, car lights) are seen this many
; times further than in the game: as in the game up close, dimmer and smaller
; further away. 1 = the game's own distances, at most 10.
CoronaDistance=5.0
; 1 = the lights of buildings and lamp posts too far away to be drawn still shine
; at night (up to 2.5 km), and the game has 120 corona slots instead of 56.
; 0 = the game's own.
FarLights=1
; 1 = the clouds rise with the camera when you are high up (they sank below a
; helicopter and the sky above was empty). 0 = the game's own.
RisingClouds=1
; 1 = with a field of view wider than the game's (a trainer's FOV slider), the near
; clip is brought in so the player's legs aren't cut off. 0 = the game's own.
WideFovNearClip=1

[Camera]
; On foot the mouse camera goes all the way round the player (you can see their
; face) and they run the way you press, as in newer games; aiming a gun turns
; them to where the camera looks. 1 = on, 0 = the game's (always from behind).
FreeOrbitOnFoot=1
; With it, the camera slowly swings back behind the player while they run and
; the mouse is left alone (as in San Andreas). 1 = on, 0 = off.
CameraSwingBehind=1
; Look around the vehicle you're in with the mouse. 1 = on, 0 = off.
FreeCam=1
; Mouse speed in percent of the on-foot camera's (which follows the game's own
; mouse sensitivity setting).
FreeCamSensitivity=100
; While driving, the camera goes back behind the vehicle after the mouse has been
; still this many milliseconds. -1 = never. Parked, it always stays where you put it.
FreeCamReturnDelay=1500
; 1 = moving the mouse forward lowers the camera instead of raising it.
FreeCamInvertY=0
; Boats use the same camera as other vehicles (the string camera that follows
; and swings behind), so the mouse look works on boats too. 0 = the game's own
; boat camera, without mouse look.
FreeCamBoats=1
; In a vehicle, holding this key puts the camera straight behind it, looking
; forward (the mouse look starts again from there). Virtual-key code, 67 = C,
; 0 = off.
CarLookForwardKey=67
; On foot, the mouse turns the camera every frame instead of 30 times a second
; (no 33-66 ms delay at high refresh rates). Needs FixedTick. 1 = on.
FrameMouseLook=1
; Mouse speed in percent, on top of the game's own menu setting (on foot, in
; vehicles, aiming).
MouseSensitivity=100
; 1 = looking up / down turns as fast as left / right (the game's vertical speed
; doesn't follow its menu slider). 0 = the game's own.
MouseEqualAxes=1
; Spread mouse movement over this many milliseconds. At hundreds of FPS a frame
; gets 0, 1 or 2 mouse counts, so slow panning stepped; 4 spreads each count
; evenly (about 2 ms delay). 0 = off (direct), 8-12 for 125 Hz mice.
MouseSmoothing=4

[QuickSave]
; F5 saves the game as it is right now, F9 loads that save. Not while wanted, on a
; mission or on water. 1 = on, 0 = off.
Enabled=1
; The game save slot (1-8) the quick save goes into; it also shows in Load Game.
; The save is named "Quick Save". If the slot holds one of your own saves, it is
; first copied to GTAVCsf<slot> (before quick save).b in the same folder.
Slot=8
; Keys as Windows virtual-key codes: 116 = F5, 120 = F9.
SaveKey=116
LoadKey=120
; Also quick save by itself every this many minutes of play (paused menus don't
; count), into the same slot, so F9 loads it. Only when it is safe: no mission or
; job, not wanted, not on water, not on a phone call or in a cutscene, in control
; and not in the air. If it isn't safe it waits and saves once it is. Any save
; restarts the count. 0 = off.
AutoMinutes=5

[AutoSave]
; Saves the game a few seconds after you pass a mission or finish a job (taxi,
; vigilante, firefighter, paramedic, rampages...) with money earned, once you are
; not wanted, not on water and in control. Not after being wasted or busted.
; Like a safehouse save, loading it starts you at your nearest safehouse.
; 1 = on, 0 = off.
Enabled=1
; The game save slot (1-8). The save is named "Auto Save"; one of your own saves
; in that slot is first copied to GTAVCsf<slot> (before auto save).b.
Slot=7

[Controls]
; Modern key layout, put back whenever the game's menu closes (a reset or change
; in the controls menu doesn't undo it): W A S D move and drive, Shift sprints,
; Q changes the radio, E sounds the horn, Caps Lock starts a vehicle mission
; (taxi, vigilante...), Num4 / Num6 roll and Num8 / Num5 pitch a helicopter
; (turret left / right / up / down), A / D turn it. No mouse button is the
; handbrake (Space is). Left Ctrl doesn't fire (the mouse and Num0 do), so it is
; free for other programs. Delete no longer aims (scopes) or zooms: the right mouse
; button aims. Bikes lean with Num8 / Num5 only (W / S don't lean them, so braking
; doesn't pull a wheelie). Other mouse and gamepad bindings are left as they are.
; 1 = on, 0 = the bindings set in the game's controls menu.
ModernKeys=1

[Vehicles]
; In the Rhino the turret, and in the fire truck the water cannon, aim where the
; camera looks: move the mouse to aim (FreeCam on). 1 = on, 0 = off.
MouseAim=1
; In the air, a car's nose and sides are steered with the helicopter controls:
; forward / back tips the nose down / up, left / right rolls it. Set the keys in
; the game's controls menu. 1 = on, 0 = off.
AirControl=1
; How fast the car turns in the air, in percent (25-300).
AirControlStrength=100
; Helicopters feel heavier: they lean, turn and speed up more slowly and carry
; their momentum; top speed and hovering stay the game's. In percent, 0 = the
; game's own light handling, up to 300.
HeliWeight=100
; Helicopter controls as in GTA V: steer left / right (A / D) turns it, turret left
; / right (Num4 / Num6) rolls it, pitch keeps its keys (Num8 / Num5). The nose
; dips only so far (pushing forward gains speed instead of diving) and it leans
; only so far to a side. Keys are the ones set in the game's controls menu.
; 1 = on, 0 = the game's own controls.
HeliControls=1
; Planes (Skimmer, RC Baron) with the same controls: steer left / right (A / D)
; turns it (rudder), turret left / right (Num4 / Num6) rolls it, pitch as before.
; No tilt limits (planes can loop and roll over). 1 = on, 0 = the game's own.
PlaneControls=1
; Furthest the nose tips up or down, in degrees (0 = no limit).
HeliMaxPitch=30
; Furthest it leans to a side, in degrees (0 = no limit).
HeliMaxRoll=40
; In the Hunter, the mouse wheel switches between rockets and the cannon (instead
; of the radio station) and HunterFireKey fires the one picked; a message shows
; which. The game's own fire keys still work. 1 = on, 0 = off.
HunterWeapons=1
; Virtual-key code of the Hunter's fire key (32 = Space).
HunterFireKey=32

[Fixes]
; "Martha's Mug Shot" swaps the Ocean Drive hotel for a stand-in model while you are
; on its roof. If the mission ends without swapping it back, the hotel stays without
; walls (and saves keep it that way). Off a mission, it is put back. 1 = on.
MissionLeftovers=1
; The riot cheat (FIGHTFIGHTFIGHT, or a trainer's riot option) is stored in the
; save and can't be turned off. Loading a game puts civilians, cops and the like
; back to normal; gangs keep their story hostility. 1 = on.
ClearRiotOnLoad=1
; The police station's "player inside" flag stays set if you leave without its
; door (teleport, flying out) and goes into the save: every load in Ocean Beach
; gave 2 stars. It is cleared while you are outside the station. 1 = on.
PoliceStationFlag=1

[StuntJumps]
; Unique stunt jumps play at normal speed and the camera keeps following your
; vehicle as usual, instead of the slow-motion cinematic camera. The jump, the
; landing check and the "UNIQUE STUNT BONUS!" reward work as before. 1 = on.
NormalCamera=1

[Missions]
; Hold this key for 3 seconds during a mission's scripted scene (the intros of
; the RC missions and others that can't be skipped) to fast-forward it. The
; scene still sets everything up; it just doesn't wait. 1 = on.
IntroSkip=1
; Virtual-key code, 13 = Enter.
IntroSkipKey=13
; A mission that leaves you without control for this many seconds (outside real
; cutscenes) is treated as stuck: a message warns, and 15 seconds later it is
; ended as if failed, so you can start it again from its marker. 0 = off.
SoftlockSeconds=90
; Hold this key for 3 seconds on a mission to end it the same way (for a mission
; stuck while you still have control). Virtual-key code, 35 = End. 0 = off.
EndMissionKey=35
; After a mission shows MISSION FAILED (or is ended with the End key or as stuck),
; ask whether to restart it: Y puts you back
; in the mission's marker, which starts it again. Only for missions started on
; foot from a marker. 1 = on.
RestartPrompt=1
; Virtual-key codes for yes and no: 89 = Y, 78 = N.
RestartYesKey=89
RestartNoKey=78
; Pizza Boy: hold the right mouse button and press the left one to throw a pizza;
; every throw (the game's look left / right + fire too) goes at the customer.
; 1 = on, 0 = the game's throw.
PizzaMouseThrow=1

[Weapons]
; Walk, run and sprint while firing any gun, each with its own animation (the fire
; animations no longer lock the legs). Sprint and jump with the rocket launcher and
; minigun. The M4, Ruger and M60 aim in third person instead of the first-person
; scope, so you can move while aiming. 1 = on.
RunAndGun=1
; Getting shot no longer stops your shooting (you still flinch). 1 = on.
KeepFiringWhenHit=1
; Drive-bys from any car, bike or boat you drive: press DriveByKey (Alt) once to
; take the gun out, aim with the mouse (the shot goes under the crosshair), fire
; to shoot, mouse wheel to switch between pistol, SMG and rifle; press it again
; to put the gun away. The gun in your hand is kept when you get in. Q / E
; drive-bys work as in the game. 1 = on.
FreeDriveBy=1
; Key that takes the gun out / puts it away (virtual-key code, 18 = Alt).
DriveByKey=18

[Population]
; How busy the streets are, 0.5 to 3 (0 = leave it to the game, which uses 0.6
; without a gta3.ini). Peds: up to 25 x PedDensity on the streets. Cars: up to
; 12 x CarDensity traffic cars.
PedDensity=2.5
CarDensity=1.5
; A ped you turn the camera away from is kept until it is this many metres away
; (25 to 50; the game removes it at 25, so peds vanish when you look around).
KeepOffscreen=50
; Walking cops about while you aren't wanted, at most (the higher ped density
; filled streets near the police station with them). Cops after you when you
; are wanted aren't limited. -1 = no limit.
MaxStreetCops=3

[PhoneSkip]
; During a phone call you answered (Tab), Enter skips the rest of the call. 1 = on.
Enabled=1
; Key as a Windows virtual-key code: 13 = Enter.
Key=13

[Interiors]
; Teleporting out of a room shows the city again, and flying into a room (jetpack)
; shows that room, with the scene loaded around you. 1 = on, 0 = off.
AutoSwitch=1
; From the street, a room built into its city building (Ocean View, the mall,
; Malibu...) is drawn through its open doorways instead of black; windows stay
; solid. From inside, the street stays drawn too. 1 = on, 0 = the game's black.
ShowOutside=1
; Walking through an interior's door doesn't fade the screen to black and back:
; the room (or the street) is there at once. Missions' and cutscenes' fades stay.
NoDoorFade=1
